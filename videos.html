    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #fff8e7;
            color: #333;
        }


        /* ================= HEADER ================= */

        header {
            background: linear-gradient(135deg, #ff9800, #e65100);
            color: white;
            text-align: center;
            padding: 25px 15px;
        }


        header h1 {
            margin: 0;
            font-size: 30px;
        }


        header p {
            margin: 8px 0 0;
            font-size: 16px;
        }


        /* ================= CONTAINER ================= */

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 25px 15px;
        }


        /* ================= YEAR TITLE ================= */

        .year-title {
            background: linear-gradient(135deg, #8e24aa, #5e35b1);
            color: white;

            padding: 12px 20px;

            border-radius: 12px;

            margin: 10px 0 20px;

            font-size: 24px;

            box-shadow: 0 5px 15px rgba(0,0,0,0.15);
        }


        /* ================= VIDEO GRID ================= */

        .video-grid {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(280px, 1fr));

            gap: 20px;
        }


        /* ================= VIDEO CARD ================= */

        .video-card {

            background: white;

            border-radius: 15px;

            overflow: hidden;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.15);

            transition: 0.3s;
        }


        .video-card:hover {

            transform: translateY(-5px);

            box-shadow:
                0 8px 25px rgba(0,0,0,0.22);
        }


        /* ================= YOUTUBE PLAYER ================= */

        .video-card iframe {

            width: 100%;

            aspect-ratio: 16 / 9;

            border: 0;

            display: block;
        }


        /* ================= VIDEO TITLE ================= */

        .video-title {

            padding: 14px 15px;

            font-size: 17px;

            font-weight: bold;

            color: #7b1fa2;
        }


        /* ================= BACK BUTTON ================= */

        .back {

            display: inline-block;

            margin-top: 25px;

            padding: 10px 18px;

            background: #ff9800;

            color: white;

            text-decoration: none;

            border-radius: 8px;

            transition: 0.3s;
        }


        .back:hover {

            background: #e65100;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header h1 {
                font-size: 25px;
            }


            header p {
                font-size: 14px;
            }


            .year-title {
                font-size: 20px;
            }


            .video-grid {
                grid-template-columns: 1fr;
            }


            .video-title {
                font-size: 16px;
            }

        }

    </style>

    <!-- =====================================================
         YOUTUBE IFRAME PLAYER API
         ===================================================== -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <script>


        /*
        =====================================================
        सभी YouTube players यहाँ store होंगे
        =====================================================
        */

        let players = [];



        /*
        =====================================================
        YouTube API तैयार होने के बाद यह function चलेगा
        =====================================================
        */

        function onYouTubeIframeAPIReady() {


            /*
            सभी video iframe खोजें
            */

            const iframes =
                document.querySelectorAll(
                    '.video-card iframe'
                );



            /*
            हर iframe को YouTube Player में convert करें
            */

            iframes.forEach(function(iframe) {


                const player =
                    new YT.Player(
                        iframe,
                        {

                            events: {

                                onStateChange:
                                    onPlayerStateChange

                            }

                        }
                    );


                /*
                Player को list में डालें
                */

                players.push(player);

            });

        }



        /*
        =====================================================
        जब किसी video की state बदले
        =====================================================
        */

        function onPlayerStateChange(event) {


            /*
            YT.PlayerState.PLAYING = 1

            मतलब video अभी चल रहा है
            */

            if (
                event.data ===
                YT.PlayerState.PLAYING
            ) {


                /*
                बाकी सभी videos को pause करें
                */

                players.forEach(
                    function(player) {


                        /*
                        जिस video को user ने चलाया है
                        उसे pause नहीं करना है
                        */

                        if (
                            player !== event.target
                        ) {

                            try {

                                player.pauseVideo();

                            }

                            catch (error) {

                                /*
                                अगर player अभी ready नहीं है
                                तो कोई समस्या नहीं
                                */

                            }

                        }

                    }
                );

            }



            /*
            =================================================
            VIDEO ENDED

            YT.PlayerState.ENDED = 0

            Video खत्म होने के बाद
            कुछ भी automatic नहीं होगा।
            अगला video नहीं चलेगा।
            =================================================
            */

            if (
                event.data ===
                YT.PlayerState.ENDED
            ) {

                try {

                    event.target.pauseVideo();

                }

                catch (error) {

                    /*
                    Ignore
                    */

                }

            }

        }


    </script>
